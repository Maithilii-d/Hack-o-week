<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

/* Default background */

body{
min-height:100vh;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
display:flex;
flex-direction:column;
align-items:center;
padding:40px 20px;
transition:background 0.6s ease;
}

/* Weather Backgrounds */

.sunny-bg{
background:linear-gradient(135deg,#f7971e,#ffd200);
}

.cloudy-bg{
background:linear-gradient(135deg,#485563,#29323c);
}

/* Dark Blue Rain Background */

.rainy-bg{
background:linear-gradient(135deg,#0f2027,#203a43,#1e4f91);
}

/* Heading */

h1{
font-size:38px;
letter-spacing:3px;
margin-bottom:10px;
}

#dateTime{
margin-bottom:25px;
font-size:18px;
opacity:0.85;
}

/* Refresh Button */

button{
padding:10px 22px;
border:none;
border-radius:8px;
background:#1f2a36;
color:white;
cursor:pointer;
margin-bottom:30px;
transition:0.3s;
}

button:hover{
background:#2e3d4e;
transform:scale(1.05);
}

/* Grid Layout */

.weather-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
width:90%;
max-width:1000px;
}

/* Cards */

.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-radius:16px;
padding:25px;
text-align:center;
cursor:pointer;
border:1px solid rgba(255,255,255,0.1);

opacity:0;
transform:translateY(30px);
animation:fadeInUp 0.8s ease forwards;

transition:transform 0.4s ease, opacity 0.3s ease, filter 0.3s ease, box-shadow 0.3s ease;
}

.card:hover{
transform:translateY(-6px);
}

/* Entrance animation */

@keyframes fadeInUp{
to{
opacity:1;
transform:translateY(0);
}
}

/* Icon */

.icon{
font-size:42px;
margin:12px 0;
}

/* Temperature */

.temp{
font-size:32px;
font-weight:bold;
margin:10px 0;
}

/* Focus card */

.card.active{
transform:scale(1.25);
z-index:5;
box-shadow:0 0 25px rgba(255,255,255,0.4);
}

/* Dim other cards */

.card.inactive{
opacity:0.25;
filter:blur(2px);
}

/* Overlay */

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
backdrop-filter:blur(4px);
display:none;
}

.overlay.show{
display:block;
}

</style>
</head>

<body>

<h1>WEATHER DASHBOARD</h1>

<div id="dateTime"></div>

<button onclick="refreshWeather()">Refresh Weather</button>

<div class="weather-container" id="weatherContainer"></div>

<div class="overlay" id="overlay"></div>

<script>

/* Weather Data */

let weatherData=[
{city:"Nagpur",temp:34,condition:"Sunny",humidity:40,feels:36,icon:"fa-sun"},
{city:"Mumbai",temp:30,condition:"Cloudy",humidity:70,feels:33,icon:"fa-cloud"},
{city:"Delhi",temp:28,condition:"Rainy",humidity:80,feels:29,icon:"fa-cloud-showers-heavy"}
];

/* Temperature Colors */

function getTempColor(condition){

if(condition==="Sunny") return "#FFD369";
if(condition==="Cloudy") return "#C9D6DF";
if(condition==="Rainy") return "#1E4F91";

return "white";

}

/* Change Background Based on Weather */

function changeBackground(condition){

document.body.classList.remove("sunny-bg","cloudy-bg","rainy-bg");

if(condition==="Sunny") document.body.classList.add("sunny-bg");
if(condition==="Cloudy") document.body.classList.add("cloudy-bg");
if(condition==="Rainy") document.body.classList.add("rainy-bg");

}

/* Display Weather Cards */

function displayWeather(){

const container=document.getElementById("weatherContainer");
container.innerHTML="";

weatherData.forEach((data,index)=>{

const card=document.createElement("div");
card.className="card";

card.innerHTML=`

<h2>${data.city}</h2>

<div class="icon">
<i class="fas ${data.icon}"></i>
</div>

<div class="temp" style="color:${getTempColor(data.condition)}">
${data.temp}°C
</div>

<div>${data.condition}</div>

<div style="margin-top:10px">Humidity: ${data.humidity}%</div>

<div>Feels Like: ${data.feels}°C</div>

`;

card.onclick=()=>{
focusCity(index);
changeBackground(data.condition);
};

container.appendChild(card);

});

}

/* Clock without seconds */

function updateTime(){

const now=new Date();

const date=now.toLocaleDateString(undefined,{
weekday:'long',
year:'numeric',
month:'long',
day:'numeric'
});

const time=now.toLocaleTimeString([],{
hour:'2-digit',
minute:'2-digit'
});

document.getElementById("dateTime").innerText=date+" | "+time;

}

/* Refresh Weather */

function refreshWeather(){

weatherData=weatherData.map(city=>{

const newTemp=city.temp + Math.floor(Math.random()*3-1);
const newHumidity=city.humidity + Math.floor(Math.random()*5-2);

return{
...city,
temp:newTemp,
humidity:newHumidity
};

});

displayWeather();

}

/* Focus City */

const overlay=document.getElementById("overlay");

function focusCity(index){

const cards=document.querySelectorAll(".card");

cards.forEach((card,i)=>{

if(i===index){
card.classList.add("active");
}else{
card.classList.add("inactive");
}

});

overlay.classList.add("show");

}

/* Close Focus */

function closeFocus(){

const cards=document.querySelectorAll(".card");

cards.forEach(card=>{
card.classList.remove("active");
card.classList.remove("inactive");
});

overlay.classList.remove("show");

document.body.classList.remove("sunny-bg","cloudy-bg","rainy-bg");

}

overlay.addEventListener("click",closeFocus);

document.addEventListener("keydown",(e)=>{
if(e.key==="Escape"){
closeFocus();
}
});

/* Initialize */

displayWeather();
updateTime();

setInterval(updateTime,60000);

</script>

</body>
</html>
