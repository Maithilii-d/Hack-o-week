<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TechFest Event Registration Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #fff9d6;
            margin: 0;
            padding: 40px 0;
            display: flex;
            justify-content: center;
        }

        .card {
            background: white;
            width: 430px;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 18px;
            margin: 4px 0;
            font-weight: bold;
        }

        .header h2 {
            font-size: 16px;
            margin: 3px 0;
            font-weight: bold;
        }

        .header h3 {
            font-size: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        /* checkbox section styled like other inputs */
        .event-box {
            margin-top: 8px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #fafafa;
        }

        .event-box label {
            font-weight: normal;
            display: block;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .event-box input {
            width: auto;
            margin-right: 6px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #f4d35e;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #e6c24a;
        }

        .success {
            display: none;
            margin-top: 15px;
            padding: 10px;
            background-color: #d4edda;
            color: #155724;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="header">
        <h1>SYMBIOSIS INSTITUTE OF TECHNOLOGY NAGPUR</h1>
        <h2>TECH FEST 2026</h2>
        <h3>TechFest Event Registration Form</h3>
    </div>

    <form id="regForm">

        <label>Full Name</label>
        <input type="text" required>

        <label>Email</label>
        <input type="email"
               placeholder="name.surname.batch2025@sitnagpur.siu.edu.in"
               required>

        <label>Phone Number</label>
        <input type="tel" required>

        <label>College Name</label>
        <input type="text" required>

        <label>Department</label>
        <select required>
            <option value="">Select Department</option>
            <option>SIT</option>
            <option>SCMS</option>
            <option>SLS</option>
            <option>SIBM</option>
        </select>

        <label>Year</label>
        <select required>
            <option value="">Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>

        <label>Select Event(s)</label>
        <div class="event-box">
            <label><input type="checkbox" name="event"> Hackathon</label>
            <label><input type="checkbox" name="event"> Coding Contest</label>
            <label><input type="checkbox" name="event"> Robotics Workshop</label>
            <label><input type="checkbox" name="event"> Tech Quiz</label>
        </div>

        <label>Total Members</label>
        <input type="number" min="1" required>

        <button type="submit">Register</button>

        <div class="success" id="successMsg">
            ✅ Registration Successful!
        </div>

    </form>

</div>

<script>
document.getElementById("regForm").addEventListener("submit", function(e){
    e.preventDefault();

    const checked = document.querySelectorAll('input[name="event"]:checked');

    if(checked.length === 0){
        alert("Please select at least one event");
        return;
    }

    document.getElementById("successMsg").style.display = "block";
    this.reset();
});
</script>

</body>
</html>
