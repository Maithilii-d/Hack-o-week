<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAGE GALLERY</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
background:linear-gradient(135deg,#e3f2fd,#f3e5f5);
padding:40px;
}

h1{
text-align:center;
margin-bottom:40px;
letter-spacing:4px;
font-weight:600;
}

/* Masonry Layout */

.gallery{
column-count:3;
column-gap:18px;
max-width:1200px;
margin:auto;
}

.gallery-item{
break-inside:avoid;
margin-bottom:18px;
cursor:pointer;
overflow:hidden;
border-radius:10px;
}

.gallery-item img{
width:100%;
display:block;
border-radius:10px;
transition:transform .4s ease;
}

.gallery-item:hover img{
transform:scale(1.08);
}

.caption{
text-align:center;
font-size:14px;
margin-top:6px;
}

/* Lightbox */

.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.92);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.lightbox img{
max-width:80%;
max-height:80%;
border-radius:8px;
animation:zoom .3s;
}

@keyframes zoom{
from{transform:scale(.8)}
to{transform:scale(1)}
}

/* Arrow buttons */

.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
font-size:50px;
color:white;
cursor:pointer;
padding:10px;
user-select:none;
}

.arrow:hover{
color:#ddd;
}

.left{
left:30px;
}

.right{
right:30px;
}

/* Responsive */

@media(max-width:900px){
.gallery{column-count:2;}
}

@media(max-width:600px){
.gallery{column-count:1;}
}

</style>
</head>

<body>

<h1>IMAGE GALLERY</h1>

<div class="gallery">

<div class="gallery-item">
<img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470">
<div class="caption">Santorini, Greece</div>
</div>

<div class="gallery-item">
<img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b">
<div class="caption">Swiss Alps</div>
</div>

<div class="gallery-item">
<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb">
<div class="caption">Bali, Indonesia</div>
</div>

<div class="gallery-item">
<img src="https://images.unsplash.com/photo-1514282401047-d79a71a590e8">
<div class="caption">Maldives</div>
</div>

<div class="gallery-item">
<img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34">
<div class="caption">Paris, France</div>
</div>

<div class="gallery-item">
<img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e">
<div class="caption">Kyoto, Japan</div>
</div>

<div class="gallery-item">
<img src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c">
<div class="caption">Dubai, UAE</div>
</div>

<div class="gallery-item">
<img src="https://images.unsplash.com/photo-1534430480872-3498386e7856">
<div class="caption">New York, USA</div>
</div>

<div class="gallery-item">
<img src="https://images.unsplash.com/photo-1523906834658-6e24ef2386f9">
<div class="caption">Venice, Italy</div>
</div>

</div>


<!-- Lightbox -->

<div class="lightbox" id="lightbox">

<span class="arrow left" id="prev">&#10094;</span>

<img id="lightbox-img">

<span class="arrow right" id="next">&#10095;</span>

</div>


<script>

const images=document.querySelectorAll(".gallery-item img")
const lightbox=document.getElementById("lightbox")
const lightboxImg=document.getElementById("lightbox-img")
const next=document.getElementById("next")
const prev=document.getElementById("prev")

let currentIndex=0

images.forEach((img,index)=>{
img.addEventListener("click",()=>{
lightbox.style.display="flex"
lightboxImg.src=img.src
currentIndex=index
})
})

function showImage(index){

if(index<0) index=images.length-1
if(index>=images.length) index=0

lightboxImg.src=images[index].src
currentIndex=index

}

next.onclick=(e)=>{
e.stopPropagation()
showImage(currentIndex+1)
}

prev.onclick=(e)=>{
e.stopPropagation()
showImage(currentIndex-1)
}

/* click outside to close */

lightbox.addEventListener("click",(e)=>{
if(e.target===lightbox){
lightbox.style.display="none"
}
})

/* keyboard navigation */

document.addEventListener("keydown",(e)=>{

if(lightbox.style.display==="flex"){

if(e.key==="ArrowRight") showImage(currentIndex+1)

if(e.key==="ArrowLeft") showImage(currentIndex-1)

if(e.key==="Escape") lightbox.style.display="none"

}

})

</script>

</body>
</html>
